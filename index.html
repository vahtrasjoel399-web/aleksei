    <!-- Форма отзыва -->

      <h3 class="ftitle" data-i18n="rev.fmTitle"></h3>

        </div>

          <label class="flabel" data-i18n="rev.ratingL"></label>
          <div class="sinp" id="starinp">
            <span class="si" data-v="1">&#9733;</span>
            <span class="si" data-v="2">&#9733;</span>
            <span class="si" data-v="3">&#9733;</span>
            <span class="si" data-v="4">&#9733;</span>
            <span class="si" data-v="5">&#9733;</span>

        <button type="submit" class="btn btn-prim" style="width:100%;justify-content:center">
          <span data-i18n="rev.submit"></span>
        </button>
        <div class="smsg" id="rv-ok"></div>
      </form>
    </div>

        <div class="ciblock"><div class="cilabel" data-i18n="cnt.emailL"></div><div class="cival"><a href="mailto:info@mildanmar.ee">info@mildanmar.ee</a></div></div>
        <div class="ciblock"><div class="cilabel" data-i18n="cnt.hoursL"></div><div class="cival" data-i18n="cnt.hours"></div></div>
        <div class="mapwrap">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d16363.5!2d26.9636!3d59.3530!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x469423f5a4e0b8c5%3A0xa41e9e50ae6e0c8b!2sKivi%C3%B5li!5e0!3m2!1set!2see!4v1700000000000!5m2!1set!2see"
            allowfullscreen loading="lazy">

        </div>

      <!-- Форма заявки -->
      <div class="cform fr">
        <h3 class="ftitle" data-i18n="cnt.fmTitle"></h3>
        <form id="cntform" novalidate>
          <div class="frow">
            <div class="fgroup">
              <label class="flabel" data-i18n="cnt.nameL"></label>
              <input type="text"  class="finput" id="c-name"  data-ph="cnt.namePh">
              <div class="emsg" id="c-ne"></div>
            </div>
            <div class="fgroup">
              <label class="flabel" data-i18n="cnt.phoneL"></label>
              <input type="tel"   class="finput" id="c-phone" data-ph="cnt.phonePh">
              <div class="emsg" id="c-pe"></div>
            </div>
          </div>
          <div class="fgroup">
            <label class="flabel" data-i18n="cnt.emailL"></label>
            <input type="email" class="finput" id="c-email" data-ph="cnt.emailPh">
            <div class="emsg" id="c-ee"></div>
          </div>
          <div class="fgroup">
            <label class="flabel" data-i18n="cnt.workL"></label>
            <select class="finput" id="c-work"></select>
          </div>
          <div class="fgroup">
            <label class="flabel" data-i18n="cnt.descL"></label>
            <textarea class="finput" id="c-desc" rows="4" data-ph="cnt.descPh"></textarea>
          </div>
          <button type="submit" class="btn btn-prim" style="width:100%;justify-content:center">
            <span data-i18n="cnt.submit"></span>
          </button>
          <div class="smsg" id="c-ok"></div>
