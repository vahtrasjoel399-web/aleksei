<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d; --bg2: #111; --bg3: #181818;
  --acc: #c4783c;
  --text: #f0ede8; --text2: #999; --text3: #484840;
  --brd: #222; --brd2: #2e2e2e;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
a { color: var(--acc); }
a:hover { text-decoration: underline; }
::selection { background: var(--acc); color: #fff; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--acc); }

header {
  background: rgba(11,11,11,.95); border-bottom: 1px solid var(--brd);
  padding: 0 28px; height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px);
}
.logo { display: flex; align-items: center; }
.logo img { height: 44px; background: #fff; padding: 5px 14px; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,.5); }
.back-link { font-size: .82rem; color: var(--text2); transition: color .2s; }
.back-link:hover { color: var(--acc); text-decoration: none; }

.lsw { display: flex; gap: 4px; }
.lb {
  padding: 5px 9px; border: 1px solid var(--brd2); border-radius: 5px;
  background: transparent; color: var(--text3);
  font-size: .7rem; font-weight: 700; cursor: pointer;
  transition: all .2s; letter-spacing: 1px; font-family: 'Inter', sans-serif;
}
.lb:hover, .lb.on { border-color: var(--acc); color: var(--acc); }
.header-right { display: flex; align-items: center; gap: 16px; }

main { max-width: 760px; margin: 0 auto; padding: 60px 28px 100px; }

.page-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 800; line-height: 1.2; margin-bottom: 8px;
}
.page-date { font-size: .8rem; color: var(--text3); margin-bottom: 48px; }

.section { margin-bottom: 40px; }
h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem; font-weight: 700;
  color: var(--text); margin-bottom: 14px;
  padding-bottom: 10px; border-bottom: 1px solid var(--brd);
}
p { font-size: .93rem; color: var(--text2); line-height: 1.85; margin-bottom: 12px; }
p:last-child { margin-bottom: 0; }
ul { padding-left: 20px; margin-bottom: 12px; }
li { font-size: .93rem; color: var(--text2); line-height: 1.85; }
strong { color: var(--text); font-weight: 600; }

.info-box {
  background: var(--bg3); border: 1px solid var(--brd2);
  border-left: 3px solid var(--acc);
  border-radius: 4px; padding: 18px 20px; margin-bottom: 40px;
}
.info-box p { margin-bottom: 4px; }

footer-pp { display: block; border-top: 1px solid var(--brd); margin-top: 60px; padding-top: 24px; text-align: center; }
footer-pp p { font-size: .8rem; color: var(--text3); }
</style>

</header>

let lang = localStorage.getItem('lang') || 'et';

function render(l) {

  document.title = t.title + ' · Mildanmar OÜ';
  document.querySelectorAll('.lb').forEach(b => b.classList.toggle('on', b.dataset.lang === l));

  document.getElementById('content').innerHTML = `
    <h1 class="page-title">${t.title}</h1>
    <p class="page-date">${t.date}</p>

    <div class="info-box section">
      <p>${t.company.p}</p>
    </div>

    <div class="section">
      <h2>${t.company.h}</h2>
      <p>${t.company.p}</p>
    </div>

    <div class="section">
      <h2>${t.collect.h}</h2>
      <ul>${t.collect.items.map(i => `<li>${i}</li>`).join('')}</ul>
    </div>

    <div class="section">
      <h2>${t.purpose.h}</h2>
      <ul>${t.purpose.items.map(i => `<li>${i}</li>`).join('')}</ul>
    </div>

    <div class="section">
      <h2>${t.basis.h}</h2>
      <p>${t.basis.p}</p>
    </div>

    <div class="section">
      <h2>${t.storage.h}</h2>
      <p>${t.storage.p}</p>
    </div>

    <div class="section">
      <h2>${t.rights.h}</h2>
      <ul>${t.rights.items.map(i => `<li>${i}</li>`).join('')}</ul>
      <p style="margin-top:12px">${t.rights.contact}</p>
    </div>

    <div class="section">
      <h2>${t.analytics.h}</h2>
      <p>${t.analytics.p}</p>
    </div>

    <div class="section">
      <h2>${t.maps.h}</h2>
      <p>${t.maps.p}</p>
    </div>

    <div class="section">
      <h2>${t.changes.h}</h2>
      <p>${t.changes.p}</p>
    </div>

    <footer-pp>
      <p>© 2025 Mildanmar OÜ · <a href="index.html">${t.back.replace('← ','')}</a></p>
    </footer-pp>
  `;
}

document.querySelectorAll('.lb').forEach(b =>
  b.addEventListener('click', () => render(b.dataset.lang))
);

render(lang);
